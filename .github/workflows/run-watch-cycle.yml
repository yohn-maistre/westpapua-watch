name: Run Watch cycle
on:
  workflow_dispatch:
    inputs:
      run_cycle:
        description: Trigger one normal discovery and editorial cycle after collecting telemetry
        type: boolean
        required: true
        default: true
permissions:
  contents: read
concurrency:
  group: watch-cycle-operator
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read editorial status before cycle
        env:
          WATCH_ADMIN_TOKEN: ${{ secrets.WATCH_ADMIN_TOKEN }}
        run: |
          test -n "$WATCH_ADMIN_TOKEN" || { echo 'WATCH_ADMIN_TOKEN production secret is required'; exit 1; }
          curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $WATCH_ADMIN_TOKEN" \
            -H 'Accept: application/json' \
            -H 'User-Agent: westpapua-watch-operator/1.0' \
            https://westpapua.watch/api/admin/review-status
      - name: Trigger one normal Watch cycle
        if: ${{ inputs.run_cycle }}
        env:
          WATCH_ADMIN_TOKEN: ${{ secrets.WATCH_ADMIN_TOKEN }}
        run: |
          curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $WATCH_ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: westpapua-watch-operator/1.0' \
            --data '' \
            https://westpapua.watch/api/admin/run
      - name: Read public health after trigger
        if: ${{ inputs.run_cycle }}
        run: |
          for path in /api/engine-health '/api/current?limit=6'; do
            curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/json' \
              -H 'User-Agent: westpapua-watch-operator/1.0' \
              "https://westpapua.watch${path}"
            printf '\n'
          done
