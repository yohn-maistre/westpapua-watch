name: Preview Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Preview credentials remain scoped to the existing protected environment.
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: npm run check:content
      - name: Install geospatial compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          ogr2ogr --version
          ogr2ogr --formats | grep PMTiles
      - name: Build Watch geography
        run: npm run geo:build
      - name: Build Pages
        run: npm run build
      - name: Check public response regressions
        run: npm run check:polish && npm run check:system
      - name: Deploy branch preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler pages deploy dist \
            --project-name=westpapua-watch \
            --branch="${GITHUB_REF_NAME}" | tee preview-deploy.txt
          url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' preview-deploy.txt | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${url}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify preview response
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
            -H 'User-Agent: westpapua-watch-preview-verifier/1.0' \
            "$PREVIEW_URL/"
