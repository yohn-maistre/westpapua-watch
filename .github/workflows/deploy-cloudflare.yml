name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check:content
      - name: Build Pages
        run: npm run build
      - name: Render Watch Engine config
        if: ${{ vars.WATCH_DB_ID != '' }}
        env:
          WATCH_DB_ID: ${{ vars.WATCH_DB_ID }}
        run: npm run watch:config
      - name: Apply Watch Engine migrations
        if: ${{ vars.WATCH_DB_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply DB --remote --config services/watch-engine/wrangler.generated.jsonc
      - name: Deploy Watch Engine
        if: ${{ vars.WATCH_DB_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config services/watch-engine/wrangler.generated.jsonc
      - name: Ensure Pages project exists
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages project create westpapua-watch --production-branch main
      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=westpapua-watch
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
